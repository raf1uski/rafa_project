apiVersion: apps/v1
kind: Deployment
metadata:
  name: safra-postgres
  labels:
    app.kubernetes.io/name: safra-ia-ops
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safra-ia-ops
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: safra-postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: safra
            - name: POSTGRES_DB
              value: safra
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: safra-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U safra -d safra
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U safra -d safra
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: safra-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: safra-postgres
  labels:
    app.kubernetes.io/name: safra-ia-ops
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

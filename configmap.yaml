apiVersion: v1
kind: ConfigMap
metadata:
  name: safra-config
  labels:
    app.kubernetes.io/name: safra-ia-ops
data:
  UVICORN_WORKERS: "2"
  # Autenticação: local (padrão) | ldap — configure em Admin ou auth_config.json / SAFRA_AUTH_MODE
  SAFRA_INGEST_USE_REDIS: "true"
  SAFRA_INGEST_QUEUE_KEY: "safra:ingest:queue"
  SAFRA_INGEST_FAILED_KEY: "safra:ingest:failed"
  SAFRA_INGEST_MERGE_NAMESPACE_WINDOW_SEC: "1800"
  # Eventos em insights_store.json e métricas: removidos após N dias (PVC)
  SAFRA_RETENTION_DAYS: "30"
  SAFRA_N8N_TSHOOT_WEBHOOK_URL: "https://n8n-n8n.apps.openshift-hml-bc.safra.com.br/webhook-test/tshoot"
  SAFRA_N8N_TRIGGER_TIMEOUT: "300"
  SAFRA_N8N_SSL_VERIFY: "false"
  STATIC_CACHE_MAX_AGE: "604800"
  # Execução no cluster (remediação via API Kubernetes)
  SAFRA_K8S_EXEC_ENABLED: "false"
  SAFRA_OPS_INCLUSTER: "true"
  # Lista de namespaces permitidos (vazio = qualquer; restrinja em produção)
  SAFRA_OPS_ALLOWED_NAMESPACES: ""
  SAFRA_OPS_CONTEXT_MAP: ""
  SAFRA_LDAP_TLS_VERIFY: "false"
  SAFRA_LDAP_CONNECT_TIMEOUT: "15"
  # Grupo AD com acesso Admin/LDAP (alternativa ao campo no auth_config.json)
  # SAFRA_LDAP_ADMIN_GROUP_DN: "CN=Safra-IA-Ops-Admins,OU=Groups,DC=empresa,DC=com"
  # SAFRA_LDAP_ADMIN_GROUP_CN: "Safra-IA-Ops-Admins"

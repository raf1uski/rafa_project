# Substitua os valores antes de aplicar em produção (ou use: oc create secret generic safra-secret --from-literal=...).
apiVersion: v1
kind: Secret
metadata:
  name: safra-secret
  labels:
    app.kubernetes.io/name: safra-ia-ops
type: Opaque
stringData:
  APP_SECRET: "CHANGE-ME-app-secret-min-32-chars"
  SAFRA_ADMIN_USER: "admin"
  SAFRA_ADMIN_PASS: "CHANGE-ME-admin-password"
  # Deve coincidir com redis/redis.conf (user admin) na imagem safra-redis.
  # Imagem padrão do repo: senha ACL admin = Sourcef0rge — troque em produção e rebuild redis.
  REDIS_PASSWORD: "Sourcef0rge"
  # Montado automaticamente no deployment web/worker via env:
  # redis://admin:$(REDIS_PASSWORD)@safra-redis:6379/0
  # Deve coincidir com oauth-client.yaml (secret) e SAFRA_OCP_OAUTH_CLIENT_ID
  SAFRA_OCP_OAUTH_CLIENT_SECRET: "CHANGE-ME-client-secret"
  # LDAP corporativo (alternativa ao auth_config.json no PVC)
  # SAFRA_LDAP_URL: "ldap://dc01.safra.com.br/DC=safra,DC=com,DC=br?sAMAccountName?sub"
  # SAFRA_LDAP_BIND_DN: "CN=usr_infrarepo,OU=Services,DC=safra,DC=com,DC=br"
  # SAFRA_LDAP_BIND_PASSWORD: "CHANGE-ME-ldap-bind"
  # SAFRA_LDAP_USER_DOMAIN: "safra.com.br"
  # SAFRA_LDAP_INSECURE: "true"
  # Token enviado pelo n8n ao acionar tshoot (header Authorization: Bearer …)
  SAFRA_N8N_WEBHOOK_TOKEN: ""
